repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: focused-tests
        name: Focused test suite
        entry: uv run pytest -q
        language: system
        pass_filenames: false
